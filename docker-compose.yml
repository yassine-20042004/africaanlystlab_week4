version: '3.8'

services:
  fintrust-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintrust_risk_api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
